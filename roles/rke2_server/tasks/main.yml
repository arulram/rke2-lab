---
- name: Verify exactly one RKE2 server is defined
  ansible.builtin.assert:
    that:
      - groups[rke2_server_group] | length == 1
    fail_msg: "This lab expects exactly one RKE2 server."

- name: Check whether RKE2 binary already exists
  ansible.builtin.stat:
    path: "{{ rke2_binary_path }}"
  register: rke2_binary_status

- name: Check whether RKE2 server service unit exists
  ansible.builtin.stat:
    path: "{{ rke2_server_unit_path }}"
  register: rke2_server_unit_status

- name: Check whether RKE2 data directory exists
  ansible.builtin.stat:
    path: "{{ rke2_data_dir }}"
  register: rke2_data_status

- name: Refuse installation on an existing RKE2 server
  ansible.builtin.assert:
    that:
      - not rke2_binary_status.stat.exists
      - not rke2_server_unit_status.stat.exists
      - not rke2_data_status.stat.exists
    fail_msg: >-
      Existing RKE2 installation or data detected.
      Installation aborted to protect the existing cluster.
    success_msg: "Safety checks passed. Server is ready for installation."

- name: Ensure curl is installed
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create RKE2 installer directory
  ansible.builtin.file:
    path: "{{ rke2_install_script_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download official RKE2 installation script
  ansible.builtin.get_url:
    url: "{{ rke2_install_script_url }}"
    dest: "{{ rke2_install_script_path }}"
    owner: root
    group: root
    mode: "0755"
    validate_certs: true

- name: Create RKE2 configuration directory
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Configure RKE2 server
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rke2_config_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install pinned RKE2 server version
  ansible.builtin.command:
    cmd: "sh {{ rke2_install_script_path }}"
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: "{{ rke2_server_install_type }}"
    INSTALL_RKE2_METHOD: "{{ rke2_install_method }}"

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable and start RKE2 server
  ansible.builtin.systemd_service:
    name: "{{ rke2_server_service }}"
    enabled: true
    state: started

- name: Wait for RKE2 registration port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ rke2_registration_port }}"
    delay: 10
    timeout: 300

- name: Wait for Kubernetes API port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ rke2_api_port }}"
    delay: 5
    timeout: 300

- name: Verify RKE2 server service is active
  ansible.builtin.command:
    cmd: systemctl is-active rke2-server
  register: rke2_server_service_status
  changed_when: false
  failed_when: rke2_server_service_status.stdout != "active"


- name: Wait for RKE2 secure agent token file
  ansible.builtin.wait_for:
    path: "{{ rke2_agent_token_file }}"
    timeout: 120

- name: Read RKE2 secure agent token
  ansible.builtin.slurp:
    src: "{{ rke2_agent_token_file }}"
  register: rke2_secure_token_result
  no_log: true

- name: Store secure agent token as an Ansible fact
  ansible.builtin.set_fact:
    rke2_agent_token_secure: "{{ rke2_secure_token_result.content | b64decode | trim }}"
  no_log: true

- name: Validate secure agent token format
  ansible.builtin.assert:
    that:
      - rke2_agent_token_secure is defined
      - rke2_agent_token_secure | length > 64
      - rke2_agent_token_secure.startswith('K10')
    fail_msg: "RKE2 secure agent token validation failed."
    success_msg: "RKE2 secure agent token was retrieved and validated."
  no_log: true
