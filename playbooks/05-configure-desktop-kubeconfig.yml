---
- name: Retrieve RKE2 server kubeconfig
  hosts: rke2_servers
  become: true
  gather_facts: false

  vars_files:
  - ../group_vars/all.yml

  tasks:
    - name: Read server kubeconfig
      ansible.builtin.slurp:
        src: "{{ rke2_server_kubeconfig }}"
      register: rke2_kubeconfig_result
      no_log: true

    - name: Store kubeconfig content for desktop configuration
      ansible.builtin.set_fact:
        rke2_kubeconfig_b64: "{{ rke2_kubeconfig_result.content }}"
      no_log: true

- name: Configure dedicated desktop kubeconfig
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
  - ../group_vars/all.yml

  pre_tasks:
    - name: Verify expected RKE2 cluster inventory
      ansible.builtin.assert:
        that:
          - groups['rke2_servers'] | length == 1
          - groups['rke2_agents'] | length == 3
          - groups['rke2_cluster'] | length == 4
          - >-
            hostvars[groups[rke2_server_group][0]]
            .rke2_kubeconfig_b64 is defined
        fail_msg: >-
          Desktop kubeconfig configuration aborted.
          Expected one server, three agents, and a retrieved
          server kubeconfig.

  tasks:
    - name: Create desktop kubeconfig directory
      ansible.builtin.file:
        path: "{{ rke2_desktop_kubeconfig | dirname }}"
        state: directory
        mode: "0700"

    - name: Prepare kubeconfig with dynamically discovered server address
      ansible.builtin.set_fact:
        rke2_desktop_kubeconfig_content: >-
          {{
            (
              hostvars[groups[rke2_server_group][0]].rke2_kubeconfig_b64
              | b64decode
            )
            | replace(
                'https://127.0.0.1:6443',
                'https://' ~
                hostvars[groups[rke2_server_group][0]].ansible_host ~
                ':' ~ (rke2_api_port | string)
              )
          }}
      no_log: true

    - name: Validate desktop kubeconfig endpoint
      ansible.builtin.assert:
        that:
          - >-
            ('https://' ~
            hostvars[groups[rke2_server_group][0]].ansible_host ~
            ':' ~ (rke2_api_port | string))
            in rke2_desktop_kubeconfig_content
        fail_msg: >-
          Expected Kubernetes API endpoint was not found in the
          generated kubeconfig. Desktop kubeconfig was not written.

    - name: Write dedicated desktop kubeconfig
      ansible.builtin.copy:
        content: "{{ rke2_desktop_kubeconfig_content }}"
        dest: "{{ rke2_desktop_kubeconfig }}"
        mode: "0600"
        backup: true
      no_log: true
