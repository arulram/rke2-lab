---
# RKE2 version and installation
rke2_version: "v1.36.6+rke2r1"
rke2_install_method: "tar"
rke2_install_script_url: "https://get.rke2.io"
rke2_install_script_path: "/usr/local/src/rke2-install.sh"

# RKE2 installation types
rke2_server_install_type: "server"
rke2_agent_install_type: "agent"

# RKE2 services
rke2_server_service: "rke2-server"
rke2_agent_service: "rke2-agent"

# RKE2 directories
rke2_config_dir: "/etc/rancher/rke2"
rke2_config_file: "/etc/rancher/rke2/config.yaml"
rke2_data_dir: "/var/lib/rancher/rke2"

# RKE2 network ports
rke2_registration_port: 9345
rke2_api_port: 6443

# Ansible inventory groups
rke2_server_group: "rke2_servers"
rke2_agent_group: "rke2_agents"

# Installation safety
rke2_require_clean_install: true

# RKE2 binary and service paths
rke2_binary_path: "/usr/local/bin/rke2"
rke2_server_unit_path: "/usr/local/lib/systemd/system/rke2-server.service"
rke2_agent_unit_path: "/usr/local/lib/systemd/system/rke2-agent.service"


# RKE2 generated secure agent token
rke2_agent_token_file: "/var/lib/rancher/rke2/server/agent-token"

# RKE2 kubectl binary and kubeconfig
rke2_kubectl_path: "/var/lib/rancher/rke2/bin/kubectl"
rke2_server_kubeconfig: "/etc/rancher/rke2/rke2.yaml"

# Desktop kubeconfig destination
rke2_desktop_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/rke2-lab.yaml"

# Local Path Provisioner
local_path_provisioner_version: "v0.0.37"
local_path_provisioner_manifest_url: "https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_provisioner_version }}/deploy/local-path-storage.yaml"
local_path_provisioner_manifest_path: "/usr/local/src/local-path-storage.yaml"
local_path_provisioner_namespace: "local-path-storage"
local_path_provisioner_deployment: "local-path-provisioner"
local_path_storageclass: "local-path"
local_path_storage_directory: "/opt/local-path-provisioner"

# Multipass VM provisioning
multipass_image: "24.04"
multipass_vm_user: "ubuntu"

multipass_ssh_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/rke2_lab_ed25519.pub"

multipass_cloud_init_path: "{{ playbook_dir }}/../tmp/rke2-lab-cloud-init.yaml"

multipass_vm_definitions:
  - name: "controlpanel"
    cpus: 2
    memory: "4G"
    disk: "20G"

  - name: "worker1"
    cpus: 1
    memory: "4G"
    disk: "15G"

  - name: "worker2"
    cpus: 1
    memory: "4G"
    disk: "15G"

  - name: "worker3"
    cpus: 1
    memory: "4G"
    disk: "15G"
